<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activities</title>
    <link rel="stylesheet" href="css/activities.css" />
  </head>
  <body>
    <div id="activityquestion"><b>Cậu muốn làm gì sau đó không?</b></div>
    <div class="activities-selection">
      <div class="activity-item">
        <img src="activities/arcade.jpeg" alt="Chơi game" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="arcade"
          />Chơi game</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/park.jpeg" alt="Đi lượn" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="stroll"
          />Đi lượn</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/images.jpg" alt="Về nhà" />
        <label
          ><input type="checkbox" name="activities" value="home" />Về nhà</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='lastpage.html'">
      Tiếp
    </button>
  </body>
</html>
